<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo de Filmes e Séries</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <!-- HEADER -->
    <header class="bg-dark text-white p-4 text-center">
        <h1>🎬 Catálogo de Filmes e Séries</h1>
        <p class="m-0">
            Abra o Console (F12) para ver os resultados
        </p>
    </header>

    <!-- CONTEÚDO -->
    <main class="container mt-5">

        <!-- IMAGEM -->
        <div class="text-center mb-4">
            <img 
                src="https://picsum.photos/900/300"
                class="img-fluid rounded shadow"
                alt="Banner catálogo">
        </div>

        <!-- RESUMO -->
        <div id="output" class="bg-white p-4 rounded shadow">
            <h2 class="mb-3">Resumo do Catálogo</h2>
        </div>

    </main>

    <!-- FOOTER -->
    <footer class="bg-dark text-white text-center p-3 mt-5">
        <p class="m-0">© 2026 - Atividade JSON JavaScript</p>
    </footer>

    <!-- SCRIPT -->
    <script src="script.js"></script>

</body>
</html>
